<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <style>
      :root {
        --bg: #071827;
        --bg2: #103b5b;
        --panel: rgba(255,255,255,0.08);
        --panel-strong: rgba(255,255,255,0.12);
        --border: rgba(255,255,255,0.16);
        --text: #eef8ff;
        --muted: #bfd4e5;
        --accent: #6ae8ff;
        --accent2: #ffca7a;
        --good: #7ef2b4;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), var(--bg2));
        color: var(--text);
      }

      .container {
        width: min(1100px, calc(100% - 24px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 4.2rem);
        letter-spacing: -0.06em;
      }

      .search-wrap {
        display: flex;
        gap: 10px;
        width: min(100%, 420px);
      }

      input, button {
        border-radius: 14px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 14px 16px;
        background: rgba(9, 20, 30, 0.45);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: rgba(106, 232, 255, 0.8);
        box-shadow: 0 0 0 2px rgba(106, 232, 255, 0.2);
      }

      button {
        padding: 14px 18px;
        background: var(--accent);
        color: #072332;
        font-weight: 800;
        cursor: pointer;
      }

      .search-wrap button.secondary {
        background: rgba(255,255,255,0.08);
        color: var(--text);
      }

      .status {
        min-height: 22px;
        margin: 0 0 18px;
        color: var(--accent2);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 20px;
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 60px rgba(0,0,0,0.2);
      }

      .location {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.1rem;
        color: var(--muted);
      }

      .current {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 26px;
      }

      .weather-icon {
        font-size: 5rem;
        line-height: 1;
      }

      .temperature {
        font-size: clamp(4rem, 12vw, 7rem);
        font-weight: 800;
        letter-spacing: -0.09em;
        line-height: 0.9;
      }

      .temperature sup {
        font-size: 0.25em;
        vertical-align: top;
      }

      .condition {
        margin-top: 8px;
        font-size: 1.1rem;
        color: var(--muted);
      }

      .updated {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 12px;
        align-content: center;
      }

      .metric {
        padding: 18px 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(9, 20, 30, 0.3);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .metric strong {
        display: block;
        margin-top: 10px;
        font-size: 1.4rem;
      }

      .forecast-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 26px 0 14px;
      }

      h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .source {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .forecast {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 12px;
      }

      .day {
        padding: 18px 10px;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--border);
        border-radius: 18px;
        text-align: center;
      }

      .day-name {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .day-icon {
        margin: 14px 0;
        font-size: 2rem;
      }

      .temps {
        display: flex;
        justify-content: center;
        gap: 8px;
        font-weight: 700;
      }

      .low {
        color: var(--muted);
        font-weight: 500;
      }

      @media (max-width: 760px) {
        .topbar, .hero {
          display: block;
        }

        .search-wrap {
          margin-top: 18px;
          width: 100%;
        }

        .forecast {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="topbar">
        <div>
          <p class="eyebrow">Travel Desk</p>
          <h1>Weather Dashboard</h1>
        </div>

        <form class="search-wrap" id="searchForm">
          <input id="cityInput" type="text" placeholder="Search a city..." autocomplete="off" />
          <button type="submit">Search</button>
          <button type="button" class="secondary" id="locateButton" aria-label="Use my location">⌖</button>
        </form>
      </div>

      <p id="status" class="status" role="status"></p>

      <section class="hero">
        <div>
          <div class="location">📍 <strong id="place">Loading…</strong></div>

          <div class="current">
            <div class="weather-icon" id="currentIcon">⛅</div>
            <div>
              <div class="temperature"><span id="temperature">--</span><sup>°C</sup></div>
              <div class="condition" id="condition">Fetching current conditions…</div>
            </div>
          </div>

          <div class="updated" id="updated"></div>
        </div>

        <div class="metrics">
          <div class="metric">
            <span>Feels like</span>
            <strong id="feelsLike">--°</strong>
          </div>
          <div class="metric">
            <span>Humidity</span>
            <strong id="humidity">--%</strong>
          </div>
          <div class="metric">
            <span>Wind</span>
            <strong id="wind">-- km/h</strong>
          </div>
          <div class="metric">
            <span>Rain chance</span>
            <strong id="rain">--%</strong>
          </div>
        </div>
      </section>

      <div class="forecast-header">
        <h2>7-Day Forecast</h2>
        <span class="source">Public data from Open-Meteo</span>
      </div>

      <section id="forecast" class="forecast"></section>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const placeEl = document.getElementById('place');
      const tempEl = document.getElementById('temperature');
      const conditionEl = document.getElementById('condition');
      const currentIconEl = document.getElementById('currentIcon');
      const feelsLikeEl = document.getElementById('feelsLike');
      const humidityEl = document.getElementById('humidity');
      const windEl = document.getElementById('wind');
      const rainEl = document.getElementById('rain');
      const updatedEl = document.getElementById('updated');
      const forecastEl = document.getElementById('forecast');

      const weatherLabels = {
        0: ['Clear sky', '☀️'],
        1: ['Mainly clear', '🌤️'],
        2: ['Partly cloudy', '⛅'],
        3: ['Overcast', '☁️'],
        45: ['Fog', '🌫️'],
        48: ['Rime fog', '🌫️'],
        51: ['Light drizzle', '🌦️'],
        53: ['Drizzle', '🌦️'],
        55: ['Heavy drizzle', '🌧️'],
        61: ['Light rain', '🌦️'],
        63: ['Rain', '🌧️'],
        65: ['Heavy rain', '🌧️'],
        71: ['Light snow', '🌨️'],
        73: ['Snow', '❄️'],
        75: ['Heavy snow', '❄️'],
        80: ['Rain showers', '🌦️'],
        81: ['Rain showers', '🌧️'],
        82: ['Heavy showers', '⛈️'],
        95: ['Thunderstorm', '⛈️'],
        96: ['Thunderstorm with hail', '⛈️'],
        99: ['Severe thunderstorm', '⛈️']
      };

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function getWeatherDescription(code) {
        return weatherLabels[code] || ['Variable conditions', '🌤️'];
      }

      function renderWeather(data, locationName) {
        const current = data.current;
        const daily = data.daily;
        const description = getWeatherDescription(current.weather_code);

        placeEl.textContent = locationName;
        tempEl.textContent = Math.round(current.temperature_2m);
        currentIconEl.textContent = description[1];
        conditionEl.textContent = description[0];
        feelsLikeEl.textContent = `${Math.round(current.apparent_temperature)}°`;
        humidityEl.textContent = `${current.relative_humidity_2m}%`;
        windEl.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        rainEl.textContent = `${Math.round(daily.precipitation_probability_max[0] || 0)}%`;
        updatedEl.textContent = `Updated ${new Date(current.time).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}`;

        forecastEl.innerHTML = daily.time.map((date, index) => {
          const day = new Date(`${date}T12:00:00`);
          const label = getWeatherDescription(daily.weather_code[index]);
          const dayLabel = index === 0 ? 'Today' : day.toLocaleDateString([], { weekday: 'short' });

          return `
            <div class="day">
              <div class="day-name">${dayLabel}</div>
              <div class="day-icon">${label[1]}</div>
              <div class="temps">
                <span>${Math.round(daily.temperature_2m_max[index])}°</span>
                <span class="low">${Math.round(daily.temperature_2m_min[index])}°</span>
              </div>
            </div>
          `;
        }).join('');
      }

      async function getWeatherByCoordinates(lat, lon, label) {
        setStatus('Loading live weather…');

        try {
          const params = new URLSearchParams({
            latitude: lat,
            longitude: lon,
            current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m',
            daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
            forecast_days: '7',
            timezone: 'auto'
          });

          const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error('Weather data unavailable');
          }

          const data = await response.json();
          renderWeather(data, label);
          setStatus('');
        } catch (error) {
          setStatus('Unable to load the weather right now. Please try again.');
        }
      }

      async function searchCity(city) {
        setStatus('Finding city…');

        try {
          const searchUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
          const response = await fetch(searchUrl);
          const data = await response.json();

          if (!data.results || !data.results.length) {
            throw new Error('City not found');
          }

          const result = data.results[0];
          getWeatherByCoordinates(result.latitude, result.longitude, `${result.name}, ${result.country}`);
        } catch (error) {
          setStatus('City not found. Try a nearby city or check the spelling.');
        }
      }

      document.getElementById('searchForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const city = document.getElementById('cityInput').value.trim();
        if (city) {
          searchCity(city);
        }
      });

      document.getElementById('locateButton').addEventListener('click', () => {
        if (!navigator.geolocation) {
          setStatus('Geolocation is not supported by this browser.');
          return;
        }

        setStatus('Requesting your location…');

        navigator.geolocation.getCurrentPosition(
          ({ coords }) => getWeatherByCoordinates(coords.latitude, coords.longitude, 'Your location'),
          () => setStatus('Location permission was not granted. Search for a city instead.')
        );
      });

      searchCity('Bengaluru');
    </script>
  </body>
</html>
